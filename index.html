<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zynedigix</title>
    <meta name="description" content="ZyneDigix — AI-powered interactive 3D websites, SaaS products and immersive brand experiences." />
    <meta name="keywords" content="AI website, 3D web, WebGL, SaaS UX, UX design, interactive experiences, ZyneDigix" />
    <meta name="theme-color" content="#0F9E90" />
    <style>
      /* Minimal preloader styles shown immediately before JS mounts */
      html,
      body,
      #root {
        min-height: 100vh;
        background: #05090d;
        color: #ffffff;
      }

      body {
        margin: 0;
      }

      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05090d;
        z-index: 9999;
      }

      #preloader .preloader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #preloader .brand {
        font-weight: 800;
        color: #ffffff;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #preloader .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #14b8a6;
        animation: spin 0.9s linear infinite;
      }

      #preloader .preloader-bar {
        width: min(360px, calc(100vw - 40px));
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        border-radius: 999px;
      }

      #preloader .preloader-barFill {
        width: 1%;
        height: 100%;
        background: linear-gradient(90deg, #14B8A6, #ffffff);
        transition: width 150ms ease;
      }

      #preloader .preloader-percent {
        font-size: 0.9rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.08em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .preloader--hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.32s ease;
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="false">
      <div class="preloader-inner">
        <div class="brand">ZyneDigix</div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="preloader-bar" aria-hidden="true">
          <span class="preloader-barFill"></span>
        </div>
        <div class="preloader-percent">01%</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

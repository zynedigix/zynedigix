    <!-- Minimal preloader styles shown immediately before JS mounts -->

    <style>
      html,
      body,
      #root {
        min-height: 100vh;
        background: #05090d;
        color: #ffffff;
      }

      body {
        margin: 0;
      }

      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05090d;
        z-index: 9999;
      }

      #preloader .preloader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #preloader .brand {
        font-weight: 800;
        color: #ffffff;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #preloader .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #14b8a6;
        animation: spin 0.9s linear infinite;
      }

      #preloader .preloader-bar {
        width: min(360px, calc(100vw - 40px));
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        border-radius: 999px;
      }

      #preloader .preloader-barFill {
        width: 1%;
        height: 100%;
        background: linear-gradient(90deg, #14b8a6, #ffffff);
        transition: width 150ms ease;
      }

      #preloader .preloader-percent {
        font-size: 0.9rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.08em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .preloader--hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.32s ease;
      }
    </style>
  </head>

  <body>
    <!-- Initial Page Preloader -->

    <div

      <div class="preloader-inner">

          class="spinner"
          aria-hidden="true"

        <div class="preloader-percent">

    </div>
